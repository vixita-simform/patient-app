<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fixture — inline-style export</title>
<style>
:root{
  /* tier 1: foundation */
  --color-green-500:#1F5634;
  --color-neutral-0:#FFFFFF;
  --color-neutral-900:#1C1C1C;
  --space-4:16px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  /* tier 2: semantic — pure references */
  --color-text-primary:var(--color-neutral-900);
  --color-surface-primary:var(--color-neutral-0);
  --color-brand:var(--color-green-500);
  /* tier 3: component — references a reference */
  --button-background:var(--color-brand);
  --card-shadow:var(--shadow-sm);
  /* legacy alias, same pattern */
  --brand:var(--color-brand);
}
.card{background:var(--color-surface-primary);box-shadow:var(--card-shadow);border-radius:12px;transition:opacity .2s}
.btn{background:var(--button-background);color:var(--color-neutral-0)}
.hero{background:linear-gradient(135deg,var(--color-green-500),var(--color-neutral-900))}
.page{display:none}
.page.active{display:block}
</style>
</head>
<body>
<div class="device">
  <div class="scroll">
    <section class="page active" id="p-signin">
      <div class="card">
        <h1>Welcome back</h1>
        <button class="btn" onclick="goStep(1)">Sign in</button>
      </div>
    </section>
    <section class="page" id="p-plan">
      <div class="card"><p>Choose a plan</p></div>
    </section>
    <section class="page" id="p-dashboard"></section>
    <section class="page" id="p-jobs"></section>
  </div>
</div>
<script id="appjs">
function goStep(n) { console.log('step', n); }
function back() { console.log('back'); }
</script>
</body>
</html>
